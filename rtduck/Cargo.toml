[package]
name = "rtduck"
version = "0.1.0"
edition = "2021"
publish = false

# DuckDB 로 쓰는 수집기(사용자 결정 2026-11-21 질문지 19: «DuckDB 형식 그대로 · 따로 된 실행 파일»).
# rtcollect 와 나눈 이유 = duckdb 묶음(C++ 전체) 빌드가 무겁다 -- rtcollect 빌드를 가볍게 둔다.
[dependencies]
# =1.10501.0 = DuckDB 1.5.1(서버 파이썬 duckdb 판 -- 2026-09-26 기록 기준). bundled = 시스템 libduckdb 없이 같은 판을 묶는다.
# parquet = 묶음에 parquet 확장을 넣는다(래스터 14일 보관 · liq_tab -- 사용자 결정 2026-11-21: 재빌드 감수).
duckdb = { version = "=1.10501.0", features = ["bundled", "parquet"] }
# 밴 파일 규칙·REST 연결(rest::agent·ban_left·ban_note)·파이썬 float repr 을 같이 쓴다.
rtcollect = { path = "../rtcollect" }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
# HL 포지션의 hot SQLite(rtcollect 와 같은 판·기능 -- 같은 산출물을 다시 쓴다)
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "macros", "time", "signal"] }
# 청산 요격기 @forceOrder 웹소켓(market_data). rtcollect 와 글자까지 같은 판·기능 -- 기능 묶음이 바뀌지 않아 DuckDB 를 다시 빌드하지 않는다.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# 시험 쪽 의존성은 두지 않는다: 기능 묶음이 바뀌면 libduckdb-sys(C++ 14분)를 다시 빌드한다(2026-11-21 실측 -- flate2 dev 의존성 하나로 세 번).
