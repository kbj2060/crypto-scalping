[package]
name = "rtui"
version = "0.1.0"
edition = "2024"

# 웹 대시보드 화면 Rust(egui) 이전 -- 첫 카드: 데스크톱 1920 풋프린트 차트(dashboard/live/app.js renderCandleSvg 의 그 부분 그대로)
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3
