[package]
name = "rtserve"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# HTTP: hyper 1 직접(+ hyper-util 의 tokio 연결 어댑터). 라우트가 정해진 글자 목록이라 라우터·미들웨어 틀(axum·tower)이 할 일이 없고,
#   원본(aiohttp)과 헤더·상태 줄·청크 전송까지 바이트를 맞추려면 응답을 손에 쥐는 쪽이 짧다. tokio 는 형제 크레이트와 같은 판(1.54).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
# preserve_order: 원본 dict 순서 그대로 · float_roundtrip: 파이썬 float() 와 같은 f64 로 읽는다(rtcollect 와 같은 기능)
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
# 파이썬 json.dumps 규칙(py_dumps_default·py_float_repr)을 그대로 쓴다 -- 같은 규칙을 두 벌 두지 않는다
rtcollect = { path = "../rtcollect" }
rusqlite = { version = "0.37", features = ["bundled"] }   # rtcollect·rtcore 와 같은 판
sha2 = "0.10"            # ETag(본문 sha256 앞 16자) · 버스터(화면 파일 sha256 앞 12자)
# 압축: 원본 aiohttp 는 C zlib(기본 수준 6 · deflate = zlib 머리 · gzip = zlib 의 gzip 머리)이다. 같은 zlib 를 써야 압축 바이트가 같다.
flate2 = { version = "1", default-features = false, features = ["zlib"] }
httpdate = "1"           # Last-Modified · If-Modified-Since
percent-encoding = "2"   # 경로·쿼리 풀기
# /api/macro-spikes 의 statistics.stdev(파이썬은 정확한 유리수로 분산을 구해 정확히 반올림한 제곱근을 낸다) -- 큰 정수가 있어야 같은 비트가 나온다
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
# 허브 구독(src/hub.rs): rtcore 의 메시지 형(proto)을 그대로 쓴다 · ws:// 접속은 tokio-tungstenite(형제 크레이트와 같은 0.26)
rtcore = { path = "../rtcore" }
tokio-tungstenite = "0.26"
# 셋째 조각: /api/liquidation-5m-signal 이 tail_risk DuckDB(rtduck market_data 가 씀)를 읽는다 · 일봉 풋프린트는 lake·소급본 parquet.
#   rtduck 와 같은 판·같은 기능(=1.10501.0 = DuckDB 1.5.1 · bundled · parquet) -- C++ 묶음 빌드가 무겁다(처음 한 번).
duckdb = { version = "=1.10501.0", features = ["bundled", "parquet"] }
# 넷째 조각: 요청 때 계산하는 모델 핸들러(src/model.rs)의 계산은 rtmodel::handlers · REST 는 rtmodel 실행 파일들과 같은 ureq(rustls · 새 크레이트 없음)
rtmodel = { path = "../rtmodel" }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
# tests/order_proxy.rs: route 정답지 중 «바깥을 안 부르는» 사례 고르기(rtorder/tests/door_bin.rs 의 pure_cases 와 같은 판정 · 그 시험 도우미를 그대로 쓴다)
rtorder = { path = "../rtorder" }

# 시험은 dev 판 그대로(전에는 opt-level 1 -- duckdb 를 넣은 뒤로 C++ 묶음을 판마다 한 번 더 빌드하게 돼 뺐다)
