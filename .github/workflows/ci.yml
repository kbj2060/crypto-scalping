name: CI

# Cloud-only checks -- this workflow has zero access to the trading host.
# It never deploys anything. scripts/ops/deploy_watcher.sh (running on the
# trading machine itself) polls this workflow's status via the GitHub API
# and only pulls+restarts once a commit's run here has concluded success.
#
# Repo has ~14.7k Python files (mostly frozen dated research scripts under
# scripts/) -- syntax-checking all of them on every push would be slow and
# mostly meaningless. Only files touched by the push/PR are checked.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          git diff --name-only --diff-filter=ACMR "$base" "${{ github.sha }}" > changed_files.txt
          echo "changed files:"
          cat changed_files.txt

      - name: Python syntax check (changed files only)
        run: |
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in
              *.py)
                echo "py_compile: $f"
                python -m py_compile "$f" || fail=1
                ;;
            esac
          done < changed_files.txt
          exit $fail

      - name: Shell syntax check (changed files only)
        run: |
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in
              *.sh)
                echo "bash -n: $f"
                bash -n "$f" || fail=1
                ;;
            esac
          done < changed_files.txt
          exit $fail

      - name: Install pyyaml
        run: pip install --quiet pyyaml

      - name: JSON/YAML syntax check (changed files only)
        run: |
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in
              *.json)
                echo "json: $f"
                python -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || fail=1
                ;;
              *.yml|*.yaml)
                echo "yaml: $f"
                python -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" "$f" || fail=1
                ;;
            esac
          done < changed_files.txt
          exit $fail
