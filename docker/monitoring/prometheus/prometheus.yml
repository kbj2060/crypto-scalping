global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "ops_watchdog_exporter"
    static_configs:
      - targets: ["127.0.0.1:9101"]

  - job_name: "node_exporter"
    static_configs:
      - targets: ["127.0.0.1:9100"]
