[package]
name = "rtmodel"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }   # Platt90·일정 JSON 의 십진 실수를 파이썬과 같은 f64 로

# 실행 파일 src/bin/rt_sr_lean.rs(접속 루프)만 쓴다 -- rtcollect 와 같은 크레이트·같은 판(rtcollect/Cargo.toml 주석: rustls 는 ring 하나만 켠다)
tokio = { version = "1", features = ["rt", "macros", "net", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
# ETH 15분·1시간(75열판)의 호가 깊이 워커 sqlite 읽기(dirshort::book_sqlite) -- rtcollect·rtcore·rtserve 와 같은 판
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.test]
opt-level = 2   # 시험이 트리 수십만 노드 × 수천 행을 돈다
